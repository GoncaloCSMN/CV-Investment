  .page{max-width:1000px; margin:24px auto; background:var(--bg); box-shadow:0 8px 34px var(--shadow); border-radius:6px; overflow:hidden}

  .toolbar{position:fixed; top:12px; right:14px; z-index:10; display:flex; gap:6px; align-items:center}
  .toolbar button{font:600 12px 'Instrument Sans',sans-serif; color:#fff; background:rgba(35,43,53,.92);
    border:1px solid var(--brass); border-radius:20px; padding:6px 12px; cursor:pointer}

  .toolbar button.on{background:var(--brass)}
  .toolbar .sp{width:6px}

  header{background:linear-gradient(135deg,#232b35 0%,#2f3d4f 58%,#3d5981 100%); color:#fff;

  .monogram{flex:none; width:58px; height:58px; border:1.5px solid var(--brass); border-radius:5px;
    display:flex; align-items:center; justify-content:center; font-family:'Spectral',Georgia,serif;
    font-weight:600; font-size:22px; letter-spacing:1px; color:#34c3e1; background:rgba(52,195,225,.08)}
  header h1{font-family:'Spectral',Georgia,serif; font-size:36px; font-weight:600; letter-spacing:.3px; line-height:1.08}
  .tagline{margin-top:6px; font-size:15px; color:#cdd7e2; font-style:italic}
  .role{margin-top:16px; font-size:13px; font-weight:500; color:#d6eef7; letter-spacing:.2px}
  .role .sep{color:#34c3e1; margin:0 6px}
  .contact{margin-top:15px; display:flex; flex-wrap:wrap; gap:8px 24px; font-size:13px}
  .contact a{color:#fff; text-decoration:none; border-bottom:1px solid rgba(52,195,225,.6)}
  .contact a:hover{border-bottom-color:var(--brass)}
  .contact a.book{border:1px solid var(--brass); border-radius:14px; padding:1px 11px; font-weight:600}
  .contact a.book:hover{background:var(--brass); color:#14273d}
  .contact span{color:#c7d1dd}

  .body{display:grid; grid-template-columns:325px 1fr}
  aside{background:var(--paper); padding:26px 24px; border-right:1px solid var(--line)}
  main{padding:26px 32px}
  aside section, main section{margin-bottom:24px}
  h2{font-size:12px; text-transform:uppercase; letter-spacing:1.6px; color:var(--ink); font-weight:700;
    margin:0 0 13px; padding-bottom:6px; border-bottom:2px solid var(--brass)}

  .summary{font-size:13.5px; color:var(--slate)}
  .summary p{margin-bottom:10px}
  .summary p:first-child::first-letter{font-family:'Spectral',Georgia,serif; font-size:40px; line-height:.9;
    font-weight:600; color:var(--ink); float:left; margin:4px 9px 0 0}

  .pillar{margin-bottom:12px}
  .pillar h3{font-size:12px; color:var(--brass-2); font-weight:700; letter-spacing:.2px; margin-bottom:5px}
  .wins{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
  .win{background:var(--champ-2); border-left:3px solid var(--brass); border-radius:4px; padding:8px 10px}
  .win b{display:block; color:var(--brass-2); font-size:12.5px; font-weight:700; margin-bottom:2px}
  .win span{font-size:11.5px; color:var(--muted); line-height:1.4}

  .job{margin-bottom:18px}
  .job .top{display:flex; justify-content:space-between; flex-wrap:wrap; gap:2px 12px; align-items:baseline}
  .job .title{font-size:14.5px; font-weight:700; color:var(--ink)}
  .job .co{font-weight:600; color:var(--brass-2)}
  .job .meta{font-size:11.5px; color:var(--muted); font-weight:500}
  .job .desc{font-size:12.5px; color:var(--muted); font-style:italic; margin:4px 0 8px}

  .job li{position:relative; padding-left:16px; font-size:13px; margin-bottom:5px; color:var(--slate)}
  .job li::before{content:""; position:absolute; left:2px; top:8px; width:5px; height:5px; background:var(--brass); border-radius:50%}

  .skillgroup{margin-bottom:14px}

  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chips span{background:var(--champ); color:var(--ink-3); font-size:11.5px; padding:4px 9px; border-radius:20px}

  .edu{font-size:12.5px; margin-bottom:11px; color:var(--slate)}
  .edu b{display:block; color:var(--ink)}
  .edu span{display:block; color:var(--muted); font-size:11.5px}
  .lang{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px; color:var(--ink)}
  .lang span{color:var(--muted)}
  ul.plain{list-style:none}
  ul.plain li{position:relative; padding-left:15px; font-size:12.5px; margin-bottom:6px; color:var(--slate)}
  ul.plain li::before{content:""; position:absolute; left:0; top:7px; width:5px; height:5px; background:var(--brass); border-radius:50%}

  footer{padding:14px 40px; background:var(--paper); border-top:1px solid var(--line); font-size:11px; color:var(--muted); text-align:center}

  @media (max-width:760px){
    .body{grid-template-columns:1fr}
    aside{border-right:none; border-bottom:1px solid var(--line)}
    .wins{grid-template-columns:1fr}
    header{padding:56px 24px 24px}
    main{padding:22px 24px}
    .toolbar{position:absolute; right:8px; flex-wrap:wrap; justify-content:flex-end; max-width:96%}
  }
  @media print{
    main a, aside a{border-bottom:none}
    .inv{break-inside:avoid}
    body{background:#fff}
    .toolbar{display:none}
    .page{box-shadow:none; margin:0; max-width:none; border-radius:0}

    .job,.win,.edu{break-inside:avoid}

  .photo{flex:none; width:104px; height:104px; border-radius:50%; object-fit:cover; border:3px solid var(--brass); background:#fff}
  .head-top{gap:24px}
  @media (max-width:760px){.photo{width:80px; height:80px}}
  .toolbar a.btn{font:600 12px 'Instrument Sans',sans-serif; color:#fff; background:rgba(35,43,53,.92); border:1px solid var(--brass); border-radius:20px; padding:6px 12px; text-decoration:none}

  @media (max-width:760px){.figs{grid-template-columns:1fr} .inv{grid-template-columns:1fr}}

  @media screen and (max-width:760px){

  @media screen and (max-width:600px){
    header h1{font-size:28px}

    header{padding-top:104px}
    .contact{align-items:center}
    .contact a,.contact span{display:inline-block; padding:7px 0}
    .contact a.book{padding:7px 14px}
    .toolbar button,.toolbar a.btn,.hdr-tools button,.hdr-tools a{min-height:34px}
  }
</style>
